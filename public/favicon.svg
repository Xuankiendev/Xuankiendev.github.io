<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="xk-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa5d19" />
      <stop offset="50%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="neon-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Hexagon / Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090611" stroke="url(#xk-glow)" stroke-width="2.5" />
  
  <!-- Corner Tech Accents -->
  <line x1="8" y1="8" x2="16" y2="8" stroke="#fa5d19" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="8" x2="8" y2="16" stroke="#fa5d19" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="56" x2="48" y2="56" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="56" x2="56" y2="48" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />

  <!-- Inner Monogram "X K" -->
  <g filter="url(#neon-filter)" stroke="url(#xk-glow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- X -->
    <line x1="15" y1="20" x2="31" y2="44" />
    <line x1="31" y1="20" x2="15" y2="44" />
    <!-- K -->
    <line x1="37" y1="20" x2="37" y2="44" />
    <line x1="49" y1="20" x2="37" y2="32" />
    <line x1="37" y1="32" x2="50" y2="44" />
  </g>

  <!-- Glowing Core Dot -->
  <circle cx="23" cy="32" r="2.5" fill="#ffe044" />
  <circle cx="49" cy="20" r="1.5" fill="#00f2fe" />
</svg>
